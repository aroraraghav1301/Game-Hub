
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | Raghav's Game Hub</title>
    <link rel="icon" href="/icon.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(
                135deg, #080b24, #18245a, #301653
            );
            color: white;
            font-family: Arial, sans-serif;
        }

        .registration-box {
            width: 100%;
            max-width: 460px;
            padding: 35px;
            background: #111936;
            border: 1px solid #5268ff;
            border-radius: 22px;
            box-shadow: 0 0 45px #344bff55;
        }

        h1 {
            text-align: center;
            color: #80eaff;
            text-shadow: 0 0 18px #00bfff;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #b9c5ed;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 14px;
            background: #202b50;
            border: 1px solid #5366a1;
            border-radius: 10px;
            color: white;
            font-size: 16px;
        }

        input::placeholder {
            color: #aeb9d6;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #48e5ff;
            box-shadow: 0 0 12px #48e5ff66;
        }

        .submit-btn {
            width: 100%;
            margin-top: 28px;
            padding: 15px;
            background: linear-gradient(
                90deg, #00c8ff, #7855ff
            );
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            filter: brightness(1.2);
        }

        .privacy {
            margin-top: 24px;
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
            color: #b9c5ed;
        }

        #message {
            text-align: center;
            color: #ffdc85;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <main class="registration-box">
        <h1>🎮 Raghav's Game Hub</h1>

        <p class="subtitle">
            Welcome! Complete this form before playing.
        </p>

        <form id="registrationForm">

            <label for="visitorName">Name *</label>
            <input
                type="text"
                id="visitorName"
                name="name"
                placeholder="Enter your name"
                maxlength="60"
                required
            >

            <label for="standard">Standard / Class *</label>
            <select id="standard" name="standard" required>
                <option value="">Select your class</option>
                <option value="1">Class 1</option>
                <option value="2">Class 2</option>
                <option value="3">Class 3</option>
                <option value="4">Class 4</option>
                <option value="5">Class 5</option>
                <option value="6">Class 6</option>
                <option value="7">Class 7</option>
                <option value="8">Class 8</option>
                <option value="9">Class 9</option>
                <option value="10">Class 10</option>
                <option value="11">Class 11</option>
                <option value="12">Class 12</option>
                <option value="Other">Other</option>
            </select>

            <label for="school">School *</label>
            <input
                type="text"
                id="school"
                name="school"
                placeholder="Enter your school"
                maxlength="100"
                required
            >

            <label for="source">
                How did you hear about Game Hub? *
            </label>

            <select id="source" name="source" required>
                <option value="">Choose an option</option>
                <option value="Friend">Friend</option>
                <option value="School">School</option>
                <option value="Google">Google</option>
                <option value="Social Media">
                    Social Media
                </option>
                <option value="Other">Other</option>
            </select>

            <button type="submit" class="submit-btn">
                Submit & Play 🚀
            </button>

            <p id="message" role="status"></p>

            <p class="privacy">
                Your responses will be stored in our
                database to help us understand our visitors
                and improve Game Hub. They will not be
                displayed publicly. Please ask a parent
                or guardian before sharing personal details.
            </p>

        </form>
    </main>

    
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const supabaseUrl =
        "https://wpdqxooopwivbzazonca.supabase.co";

    const supabaseKey =
        "sb_publishable_9wI9m5g9qLnjMtJzPGM5pA_KeJ36NWD";

    const db = window.supabase.createClient(
        supabaseUrl,
        supabaseKey
    );

    const form = document.getElementById("registrationForm");
    const message = document.getElementById("message");
    const submitButton = form.querySelector(
        'button[type="submit"]'
    );

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        submitButton.disabled = true;
        submitButton.textContent = "Registering...";
        message.textContent = "";

        const visitor = {
            name: document.getElementById("visitorName").value.trim(),
            standard: document.getElementById("standard").value,
            school: document.getElementById("school").value.trim(),
            source: document.getElementById("source").value
        };

        try {
            const { error } = await db
                .from("visitors")
                .insert(visitor);

            if (error) {
                throw error;
            }

            message.textContent =
                "Registration successful! Opening Game Hub...";

            sessionStorage.setItem("registered", "true");

            window.location.href = "/games.html";

        } catch (error) {
            console.error("Registration error:", error);

            message.textContent =
                "Registration failed. Please try again.";

            submitButton.disabled = false;
            submitButton.textContent = "Submit & Play 🚀";
        }
    });
</script>

</body>
</html>
